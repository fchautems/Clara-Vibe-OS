[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clara-vibe-os"
version = "0.1.0"
description = "Prototype vocal local pour l'Explorateur Windows"
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
windows = [
  "PySide6==6.9.3", "sounddevice==0.5.3", "numpy==2.2.6",
  "vosk==0.3.45", "faster-whisper==1.2.0", "psutil==7.1.0",
  "pywin32==311; sys_platform == 'win32'", "pywinauto==0.6.9; sys_platform == 'win32'",
]

[project.scripts]
clara = "clara.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clara = ["resources/*.json"]
